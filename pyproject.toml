[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroguard"
version = "0.2.0"
description = "Flight-aware UAV perception and review console"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ml = [
  "lightning>=2.4,<3",
  "torch>=2.4,<3",
  "torchmetrics[detection]>=1.5,<2",
  "torchvision>=0.19,<1",
]
dev = [
  "matplotlib>=3.9,<4",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
aeroguard-api = "aeroguard.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
