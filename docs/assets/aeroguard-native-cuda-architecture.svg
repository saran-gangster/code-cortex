<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AeroGuard native CUDA and TensorRT edge architecture</title>
  <desc id="desc">A simple architecture diagram showing a drone frame moving through OpenCV decode, fused CUDA preprocessing, TensorRT YOLO26 inference, CUDA postprocessing, and the AeroGuard review stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071117"/>
      <stop offset="1" stop-color="#0c1d22"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9f34a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#64e6d2" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#78d9cc"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Segoe UI, Arial, sans-serif; fill: #f3f7f4; }
      .subtitle { font: 400 19px Inter, Segoe UI, Arial, sans-serif; fill: #91a9ad; }
      .eyebrow { font: 700 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #75d8ca; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #f5f8f5; }
      .box-copy { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #afbec0; }
      .small { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #8fa2a6; }
      .badge { font: 700 13px Inter, Segoe UI, Arial, sans-serif; fill: #dfffa4; }
      .metric { font: 700 25px Inter, Segoe UI, Arial, sans-serif; fill: #c8f76e; }
      .metric-label { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #97aaad; }
      .arrow { fill: none; stroke: #78d9cc; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="-80" r="370" fill="#1f6c67" opacity="0.10"/>
  <circle cx="90" cy="920" r="300" fill="#b9f34a" opacity="0.05"/>

  <text x="80" y="82" class="eyebrow">AEROGUARD · EDGE INFERENCE</text>
  <text x="80" y="134" class="title">Native C++ / CUDA deployment path</text>
  <text x="80" y="170" class="subtitle">Final YOLO26s-960 model · Jetson Orin · experimental and not yet parity-validated</text>

  <g transform="translate(80 218)" filter="url(#shadow)">
    <rect width="250" height="262" rx="20" fill="#101f25" stroke="#294047" stroke-width="2"/>
    <rect x="20" y="20" width="92" height="28" rx="14" fill="#173039"/>
    <text x="66" y="39" class="eyebrow" text-anchor="middle">INPUT</text>
    <text x="24" y="88" class="box-title">Drone RGB frame</text>
    <rect x="24" y="112" width="202" height="88" rx="12" fill="#0a151a" stroke="#263b42"/>
    <path d="M52 170L86 137L112 160L138 130L202 187H52Z" fill="#31514c"/>
    <circle cx="178" cy="139" r="12" fill="#c8f76e" opacity="0.85"/>
    <text x="24" y="227" class="box-copy">AU-AIR aerial image</text>
    <text x="24" y="251" class="small">OpenCV C++ decode · CPU</text>
  </g>

  <path d="M330 349H390" class="arrow"/>

  <g transform="translate(395 218)" filter="url(#shadow)">
    <rect width="300" height="262" rx="20" fill="url(#gpu)" stroke="#548e79" stroke-width="2"/>
    <rect x="20" y="20" width="112" height="28" rx="14" fill="#244331"/>
    <text x="76" y="39" class="badge" text-anchor="middle">CUDA 12.4</text>
    <text x="24" y="88" class="box-title">Fused preprocessing</text>
    <text x="24" y="125" class="box-copy">• Resize + centered letterbox</text>
    <text x="24" y="153" class="box-copy">• BGR → RGB</text>
    <text x="24" y="181" class="box-copy">• HWC → FP16 NCHW</text>
    <text x="24" y="209" class="box-copy">• Normalize pixels to 0–1</text>
    <line x1="24" y1="226" x2="276" y2="226" stroke="#43615a"/>
    <text x="24" y="250" class="small">Pinned memory · asynchronous H→D copy</text>
  </g>

  <path d="M695 349H755" class="arrow"/>

  <g transform="translate(760 218)" filter="url(#shadow)">
    <rect width="330" height="262" rx="20" fill="#111f25" stroke="#78a44a" stroke-width="2"/>
    <rect x="20" y="20" width="132" height="28" rx="14" fill="#30451e"/>
    <text x="86" y="39" class="badge" text-anchor="middle">TENSORRT 10.3</text>
    <text x="24" y="88" class="box-title">YOLO26s-960 inference</text>
    <text x="24" y="125" class="box-copy">9.95M parameter detector</text>
    <text x="24" y="153" class="box-copy">FP16 engine · batch size 1</text>
    <text x="24" y="181" class="box-copy">8 AU-AIR object classes</text>
    <text x="24" y="209" class="box-copy">Direct C++ enqueueV3</text>
    <line x1="24" y1="226" x2="306" y2="226" stroke="#43543a"/>
    <text x="24" y="250" class="small">NVIDIA Jetson Orin GPU</text>
  </g>

  <path d="M1090 349H1150" class="arrow"/>

  <g transform="translate(1155 218)" filter="url(#shadow)">
    <rect width="365" height="262" rx="20" fill="url(#gpu)" stroke="#548e79" stroke-width="2"/>
    <rect x="20" y="20" width="112" height="28" rx="14" fill="#244331"/>
    <text x="76" y="39" class="badge" text-anchor="middle">CUDA / C++</text>
    <text x="24" y="88" class="box-title">Detection postprocessing</text>
    <rect x="24" y="112" width="317" height="48" rx="10" fill="#0e1b20" stroke="#34535a"/>
    <text x="40" y="134" class="small">[1, N, 6] end-to-end output</text>
    <text x="40" y="151" class="box-copy">Confidence filter only</text>
    <text x="182" y="181" class="eyebrow" text-anchor="middle">OR</text>
    <rect x="24" y="194" width="317" height="48" rx="10" fill="#0e1b20" stroke="#34535a"/>
    <text x="40" y="216" class="small">[1, 12, N] raw output</text>
    <text x="40" y="233" class="box-copy">CUDA decode + class-aware NMS</text>
  </g>

  <path d="M1338 480V536" class="arrow"/>

  <g transform="translate(760 540)" filter="url(#shadow)">
    <rect width="760" height="136" rx="20" fill="#0e1b20" stroke="#294047" stroke-width="2"/>
    <text x="28" y="43" class="eyebrow">REVIEW OUTPUT</text>
    <text x="28" y="79" class="box-title">Evidence-ready results</text>
    <text x="28" y="109" class="box-copy">C++ JSON detections + optional annotated frame</text>
    <path d="M364 68H420" class="arrow"/>
    <rect x="438" y="27" width="126" height="82" rx="12" fill="#14272e" stroke="#31505a"/>
    <text x="501" y="61" class="box-title" text-anchor="middle">FastAPI</text>
    <text x="501" y="86" class="small" text-anchor="middle">evidence API</text>
    <path d="M564 68H606" class="arrow"/>
    <rect x="624" y="27" width="108" height="82" rx="12" fill="#14272e" stroke="#31505a"/>
    <text x="678" y="61" class="box-title" text-anchor="middle">React</text>
    <text x="678" y="86" class="small" text-anchor="middle">judge console</text>
  </g>

  <g transform="translate(80 540)" filter="url(#shadow)">
    <rect width="610" height="244" rx="20" fill="#101f25" stroke="#294047" stroke-width="2"/>
    <text x="26" y="42" class="eyebrow">MEASURED REFERENCE · EXISTING PYTHON PATH</text>
    <text x="28" y="94" class="metric">31.9 ms</text>
    <text x="28" y="118" class="metric-label">END-TO-END LATENCY</text>
    <text x="210" y="94" class="metric">31.3 FPS</text>
    <text x="210" y="118" class="metric-label">JETSON ORIN THROUGHPUT</text>
    <text x="410" y="94" class="metric">21.3 ms</text>
    <text x="410" y="118" class="metric-label">TENSORRT MODEL</text>
    <line x1="28" y1="144" x2="582" y2="144" stroke="#2d464d"/>
    <text x="28" y="176" class="box-copy">Potential native targets: 5.76 ms preprocessing</text>
    <text x="28" y="202" class="box-copy">+ 3.80 ms postprocessing / framework overhead</text>
    <text x="28" y="228" class="small">No native speedup claimed until Jetson parity and benchmarking.</text>
  </g>

  <g transform="translate(760 712)">
    <rect width="760" height="72" rx="16" fill="#13252b" stroke="#2b454c"/>
    <text x="24" y="28" class="eyebrow">TECH STACK</text>
    <text x="24" y="53" class="box-copy">C++17  ·  CUDA 12.4  ·  TensorRT 10.3  ·  OpenCV  ·  CMake  ·  Jetson Orin  ·  JSON  ·  FastAPI  ·  React</text>
  </g>

  <text x="80" y="850" class="small">Status: implementation prototype · selected model: YOLO26s-960 · target: supervised aerial review, not autonomous flight control</text>
</svg>
